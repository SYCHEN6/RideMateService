# 服务器配置
server:
  port: 13579
  servlet:
    context-path: /api

# Spring配置
spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ridemate?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
    username: root
    password: Changeme_456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

  # MinIO配置
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: ridemate
    secure: false

  # Spring AI配置
  ai:
    # 阿里云通义千问配置
    alibaba:
      tongyi:
        api-key: ${ALIYUN_TONGYI_API_KEY}
        chat:
          options:
            model: qwen-plus
            temperature: 0.7
        embedding:
          options:
            model: text-embedding-v1

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ridemate.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true

# 日志配置
logging:
  level:
    com.ridemate: trace
    org.mybatis: trace
    org.springframework: trace
    com.zaxxer.hikari: trace
    java.sql: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
